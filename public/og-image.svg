  <style>
    @font-face {
      font-family: "Fraunces";
      font-style: normal;
      font-weight: 450;
      src: url("/fonts/fraunces.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      font-style: normal;
      font-weight: 700;
      src: url("/fonts/inter-bold.woff2") format("woff2");
    }
    .title { font-family: "Fraunces", Georgia, serif; font-weight: 450; }
